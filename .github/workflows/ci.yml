name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and verify
    runs-on: [self-hosted, dfn-android]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up JDK 17 (Temurin) for unit-test toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Populate Gradle properties with Mapbox tokens and server URL
        run: |
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" >> ~/.gradle/gradle.properties
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" >> ~/.gradle/gradle.properties

          echo "PRODUCTION_SERVER_URL=${{ secrets.PRODUCTION_SERVER_URL }}" >> ~/.gradle/gradle.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint detekt tests and assembleDebug
        run: ./gradlew --no-daemon ktlintCheck detekt test assembleDebug assembleDebugAndroidTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/test/**

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/**