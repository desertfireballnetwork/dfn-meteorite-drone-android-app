name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Populate Gradle properties
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          PRODUCTION_SERVER_URL: ${{ secrets.PRODUCTION_SERVER_URL }}
        run: |
          mkdir -p ~/.gradle
          {
            printf 'MAPBOX_DOWNLOADS_TOKEN=%s\n' "$MAPBOX_DOWNLOADS_TOKEN"
            printf 'MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_ACCESS_TOKEN"
            printf 'PRODUCTION_SERVER_URL=%s\n' "$PRODUCTION_SERVER_URL"
          } > ~/.gradle/gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "dfn-stage4-${{ github.ref_name }}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dfn-stage4-${{ github.ref_name }}.apk" \
            --title "${{ github.ref_name }}" \
            --generate-notes
